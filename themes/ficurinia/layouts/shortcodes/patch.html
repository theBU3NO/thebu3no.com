{{ $symbol := .Get "type" | default (.Get 0 | default "+") }}
{{ $title := .Get "title" | default (.Get 1) }}
{{ $colorClass := "patch-green" }}
{{ if or (eq $symbol "-") (eq $symbol "red") }}
  {{ $colorClass = "patch-red" }}
{{ end }}

<div class="patch-entry">
  <span class="patch-symbol {{ $colorClass }}">{{ $symbol }}</span><strong class="patch-title">{{ $title }}</strong> <span class="patch-comment">//<span class="patch-body">{{ .Inner | markdownify }}</span></span>
</div>
